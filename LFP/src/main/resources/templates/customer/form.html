<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .customer-form {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-title {
            color: #0d6efd;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #0d6efd;
        }
        .required::after {
            content: " *";
            color: #dc3545;
        }
        .form-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="customer-form">
        <h2 class="form-title">
            <i class="bi bi-person-plus"></i> Add New Customer
        </h2>

        <form th:action="@{/customers/save}" th:object="${customer}" method="post" class="needs-validation" novalidate>

            <!-- Customer Information Section -->
            <div class="form-section">
                <h5 class="mb-3"><i class="bi bi-info-circle"></i> Customer Information</h5>

                <!-- Customer Name -->
                <div class="mb-3">
                    <label for="name" class="form-label required">Customer Name</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           th:field="*{name}"
                           required
                           placeholder="Enter customer's full name">
                    <div class="invalid-feedback">
                        Please enter customer name.
                    </div>
                </div>

                <!-- Customer Number -->
                <div class="mb-3">
                    <label for="customerNO" class="form-label required">Customer Number</label>
                    <input type="text"
                           class="form-control"
                           id="customerNO"
                           th:field="*{customerNO}"
                           required
                           placeholder="Enter unique customer number">
                    <div class="form-text">
                        This must be a unique identifier for the customer.
                    </div>
                    <div class="invalid-feedback">
                        Please enter a customer number.
                    </div>
                </div>

                <!-- Date Created -->
                <div class="mb-3">
                    <label for="dateCreated" class="form-label">Date Created</label>
                    <input type="date"
                           class="form-control"
                           id="dateCreated"
                           th:field="*{dateCreated}">
                    <div class="form-text">
                        Leave blank to use today's date.
                    </div>
                </div>
            </div>

            <!-- Form Buttons -->
            <div class="d-flex justify-content-between mt-4">
                <a href="/dashboard" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Cancel
                </a>
                <div>
                    <button type="reset" class="btn btn-outline-warning me-2">
                        <i class="bi bi-arrow-clockwise"></i> Clear
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Save Customer
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form Validation Script -->
<script>
    (function() {
        'use strict';

        // Fetch all forms
        const forms = document.querySelectorAll('.needs-validation');

        // Loop and prevent submission
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });

        // Auto-set today's date if dateCreated is empty
        document.addEventListener('DOMContentLoaded', function() {
            const dateField = document.getElementById('dateCreated');
            if (dateField && !dateField.value) {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                dateField.value = `${year}-${month}-${day}`;
            }

            // Auto-generate customer number if empty
            const customerNoField = document.getElementById('customerNO');
            if (customerNoField && !customerNoField.value) {
                // Simple auto-generation - you can customize this
                const timestamp = Date.now().toString().slice(-6);
                customerNoField.value = 'CUST-' + timestamp;
            }
        });
    })();
</script>
</body>
</html>
