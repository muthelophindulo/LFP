<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Todo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-form {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
        .required::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="product-form">
        <h2 class="form-header">Add New Todo</h2>

        <form th:action="@{/todo/save}" th:object="${Todo}" method="post">

            <!-- Todo ID Field -->
            <div class="mb-3">
                <label for="todoId" class="form-label required">Todo ID</label>
                <input type="text"
                       class="form-control"
                       id="todoId"
                       th:field="*{todoId}"

                       placeholder="Enter unique Todo ID (e.g., TODO-001)">
                <div class="form-text">Must be unique. This will be the todo's identifier.</div>
            </div>

            <!-- Todo Name Field -->
            <div class="mb-3">
                <label for="name" class="form-label required">Todo Name</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       th:field="*{name}"
                       required
                       placeholder="Enter Todo name">
                <div class="form-text">Must be unique. Choose a descriptive name for the Todo.</div>
            </div>

            <!-- Description Field -->
            <div class="mb-3">
                <label for="description" class="form-label required">Description</label>
                <textarea class="form-control"
                          id="description"
                          th:field="*{description}"
                          rows="4"
                          required
                          placeholder="Enter product description"></textarea>
                <div class="form-text">Describe the Todo details.</div>
            </div>


            <!-- Form Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/todo/list" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to todos
                </a>
                <div>
                    <button type="reset" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-x-circle"></i> Clear
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Add Todo
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
