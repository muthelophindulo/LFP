<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Measurement</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h4 class="mb-0">Todo Details</h4>
                </div>

                <!-- product Table -->
                <div class="row">

                    <div class="col-md-6 mb-4">
                        <h6 class="text-uppercase text-muted fw-semibold mb-3">Todo summery</h6>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle">
                                <tbody>
                                <tr>
                                    <th class="w-50">Todo ID</th>
                                    <td th:text="${Todo.todoId}">PROD-001</td>
                                </tr>
                                <tr>
                                    <th>Name</th>
                                    <td th:text="${Todo.name}">nwenda</td>
                                </tr>
                                <tr>
                                    <th>Description</th>
                                    <td th:text="${Todo.description}">size 30</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer text-end bg-white rounded-bottom-4">
            <a th:href="@{/todo/list}" class="btn btn-secondary">Back</a>
            <a th:href="@{/todo/edit/{id}(id=${Todo.id})}" class="btn btn-primary">Edit</a>
        </div>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
