spring.application.name=LFP
# ===== DATABASE CONNECTION =====
# Connect to your Ifp_db database
spring.datasource.url=jdbc:mysql://localhost:3306/lfp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Use the springuser you created
spring.datasource.username=springuser
spring.datasource.password=SpringPass123!

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA/HIBERNATE CONFIGURATION =====
# Auto create/update tables (for development)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console (helpful for debugging)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8 dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== CONNECTION POOL SETTINGS =====
# Optimize performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===== SERVER CONFIGURATION =====
# Run on port 8080
server.port=8081

# Allow connections from any IP (for phone testing)
server.address=0.0.0.0

spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false