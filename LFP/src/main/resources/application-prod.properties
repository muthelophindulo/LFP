# TiDB Cloud Configuration
spring.datasource.url=jdbc:mysql://${TIDB_HOST:gateway01eu-central-iprodawstidbcloud.com}:${TIDB_PORT:4000}/${TIDB_DATABASE:test}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${TIDB_USERNAME:2FaXCW7MfasCHyM.root}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# TiDB Optimizations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Hikari Connection Pool (optimized for TiDB)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Server
server.port=${PORT:8081}
server.address=0.0.0.0

# Security
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# Thymeleaf
spring.thymeleaf.cache=true