<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Measurement</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h4 class="mb-0">Measurement Details</h4>
                </div>

                <div class="card-body">
                    <!-- Measurement Summary -->
                    <div class="mb-4">
                        <h5 class="fw-semibold" th:text="${measurement.name}">Client Name</h5>
                        <small class="text-muted">
                            Date Taken:
                            <span th:text="${#temporals.format(measurement.measurementDate, 'dd MMM yyyy HH:mm')}">
                                01 Jan 2025 10:00
                            </span>
                        </small>
                    </div>

                    <!-- Measurements Tables -->
                    <div class="row">
                        <!-- Upper Body -->
                        <div class="col-md-6 mb-4">
                            <h6 class="text-uppercase text-muted fw-semibold mb-3">Upper Body</h6>
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle">
                                    <tbody>
                                    <tr>
                                        <th class="w-50">Bust</th>
                                        <td th:text="${measurement.bust}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Shoulder</th>
                                        <td th:text="${measurement.shoulder}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Sleeves</th>
                                        <td th:text="${measurement.sleeves}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Top Length</th>
                                        <td th:text="${measurement.topLength}">0.0</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>


                        <!-- Lower Body -->
                        <div class="col-md-6 mb-4">
                            <h6 class="text-uppercase text-muted fw-semibold mb-3">Lower Body</h6>
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle">
                                    <tbody>
                                    <tr>
                                        <th class="w-50">Hips</th>
                                        <td th:text="${measurement.hips}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Thigh</th>
                                        <td th:text="${measurement.thigh}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Bottom Waist</th>
                                        <td th:text="${measurement.bottomWaist}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Bottom Length</th>
                                        <td th:text="${measurement.bottomLength}">0.0</td>
                                    </tr>
                                    <tr>
                                        <th>Inseam</th>
                                        <td th:text="${measurement.inseam}">0.0</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                </div>

                <div class="card-footer text-end bg-white rounded-bottom-4">
                    <a th:href="@{/measurements/list}" class="btn btn-secondary">Back</a>
                    <a th:href="@{/measurements/edit/{id}(id=${measurement.id})}" class="btn btn-primary">Edit</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
