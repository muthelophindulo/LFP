<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Product</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-form {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
        .required::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="product-form">
        <h2 class="form-header">Add New Product</h2>

        <form th:action="@{/products/save}" th:object="${product}" method="post">

            <!-- Product ID Field -->
            <div class="mb-3">
                <label for="productID" class="form-label required">Product ID</label>
                <input type="text"
                       class="form-control"
                       id="productID"
                       th:field="*{productID}"

                       placeholder="Enter unique product ID (e.g., PROD-001)">
                <div class="form-text">Must be unique. This will be the product's identifier.</div>
            </div>

            <!-- Product Name Field -->
            <div class="mb-3">
                <label for="name" class="form-label required">Product Name</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       th:field="*{name}"
                       required
                       placeholder="Enter product name">
                <div class="form-text">Must be unique. Choose a descriptive name for the product.</div>
            </div>

            <!-- Description Field -->
            <div class="mb-3">
                <label for="description" class="form-label required">Description</label>
                <textarea class="form-control"
                          id="description"
                          th:field="*{description}"
                          rows="4"
                          required
                          placeholder="Enter product description"></textarea>
                <div class="form-text">Describe the product features and details.</div>
            </div>

            <!-- Price Field -->
            <div class="mb-4">
                <label for="price" class="form-label required">Price</label>
                <div class="input-group">
                    <span class="input-group-text">R</span>
                    <input type="number"
                           class="form-control"
                           id="price"
                           th:field="*{price}"
                           step="0.01"
                           min="0"
                           required
                           placeholder="0.00">
                </div>
                <div class="form-text">Enter the price in Rands and cents.</div>
            </div>

            <!-- Form Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/products" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Products
                </a>
                <div>
                    <button type="reset" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-x-circle"></i> Clear
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Add Product
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Optional: Form validation script -->
<script>
    // Form validation
    (function() {
        'use strict';

        // Fetch all forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll('.needs-validation');

        // Loop over them and prevent submission
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();

    // Add validation classes to form
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        form.classList.add('needs-validation');
    });
</script>
</body>
</html>
